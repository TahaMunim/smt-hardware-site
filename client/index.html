<!DOCTYPE html>

    ====================================================== -->

      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="theme-color"
      content="#000000"
    />

    <!-- =====================================================
         PRIMARY SEO
    ====================================================== -->
    <title>
      Saleh Mohsin Trading LLC | Industrial Tools & Supplies UAE

    <meta
      name="description"
      content="Saleh Mohsin Trading LLC supplies professional tools, construction supplies, safety equipment, industrial products and trade consumables to businesses across the UAE."

      name="author"

    />

      content="index, follow"

    <link
      rel="canonical"
      href="https://www.salehmohsin.com/"

    <!-- =====================================================
         OPEN GRAPH

    ====================================================== -->

      property="og:type"

    />

    <meta
      property="og:site_name"
      content="Saleh Mohsin Trading LLC"

      property="og:title"
      content="Saleh Mohsin Trading LLC | Industrial Tools & Supplies UAE"

      property="og:url"
      content="https://www.salehmohsin.com/"
    />

    <meta
      property="og:image"
      content="https://www.salehmohsin.com/SMTLogo.png"
    />

    <meta
      property="og:image:alt"
      content="Saleh Mohsin Trading LLC"
    />

    <meta
      property="og:locale"
      content="en_AE"
    />

      name="twitter:card"
      content="summary"

      name="twitter:description"
